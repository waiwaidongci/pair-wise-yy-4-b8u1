<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录 · 层位编录台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; margin: 14px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #64777b; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 64px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .app { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .side { max-height: calc(100vh - 110px); overflow: auto; }
    .map { position: relative; height: calc(100vh - 128px); min-height: 560px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .tabs button { background: #64777b; }
    .tabs button.active { background: #1d6c78; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .list { display: grid; gap: 8px; max-height: 330px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .item.rejected { border-style: dashed; opacity: .8; }
    .timeline { display: grid; gap: 8px; max-height: 240px; overflow: auto; }
    .pill { display: inline-block; padding: 3px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .pill.ok { background: #e2f4e5; border-color: #b7dfc0; color: #256b33; }
    .pill.warn { background: #fbe4e4; border-color: #eec5c5; color: #a33; }
    .status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .status.ok { background: #e2f4e5; color: #256b33; }
    .status.bad { background: #fbe4e4; color: #a33; }
    .profile-item { border: 1px solid #d7e4e5; border-left: 4px solid #1d6c78; border-radius: 8px; padding: 10px; }
    .banner { border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .banner.ok { background: #e2f4e5; color: #256b33; }
    .impact { border: 1px solid #e0b34c; background: #fdf6e3; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .impact ul { margin: 6px 0; padding-left: 18px; }
    .impact button { margin-top: 4px; }
    .muted { color: #5c7378; font-size: 13px; }
    @media (max-width: 980px) { header { display: block; } .app { grid-template-columns: 1fr; } .map { height: 560px; } .side { max-height: none; } }
  </style>
</head>
<body>
  <header>
    <div><h1>水下考古潜水记录 · 层位编录台</h1><div class="muted">点击沉船平面图添加遗物标记；在层位编录台登记探方、层位并发布剖面。</div></div>
    <button id="exportBtn">导出JSON</button>
  </header>
  <main class="app">
    <section class="panel">
      <div class="map" id="map"><div class="wreck"></div></div>
    </section>
    <aside class="panel side">
      <div class="tabs">
        <button id="tabMarks" class="active" type="button">遗物标记</button>
        <button id="tabLayers" type="button">层位编录</button>
      </div>

      <section id="paneMarks">
        <div class="toolbar">
          <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <select id="view"><option value="list">标记列表</option><option value="timeline">潜次时间线</option></select>
        </div>
        <form id="form">
          <h2>标记信息</h2>
          <input name="id" type="hidden">
          <label>编号</label><input name="code" required>
          <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <label>潜次</label><input name="dive" placeholder="例如DIVE-04" required>
          <label>深度</label><input name="depth" placeholder="例如18.4m" required>
          <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
          <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
          <label>所属层位</label><select name="layerId"></select>
          <label>备注</label><textarea name="note"></textarea>
          <div class="toolbar"><button>保存标记</button><button type="button" id="deleteBtn" class="secondary">删除</button></div>
        </form>
        <h2 id="listTitle">标记列表</h2>
        <div id="list" class="list"></div>
      </section>

      <section id="paneLayers" hidden>
        <h2>探方档案</h2>
        <label>当前探方</label>
        <select id="squareSelect"></select>
        <div id="squareNote" class="muted"></div>
        <form id="squareForm">
          <div class="toolbar">
            <div><label>新探方名称</label><input name="name" placeholder="例如 T3" required></div>
            <div><label>档案备注</label><input name="note" placeholder="位置、水深"></div>
          </div>
          <button>登记探方</button>
        </form>

        <h2>层位登记</h2>
        <form id="layerForm">
          <input name="id" type="hidden">
          <div class="toolbar">
            <div><label>层号</label><input name="layerNo" placeholder="例如 L4" required></div>
            <div><label>直接上层</label><select name="aboveId"></select></div>
          </div>
          <div class="toolbar">
            <div><label>顶深（m）</label><input name="topDepth" type="number" step="0.01" min="0" required></div>
            <div><label>底深（m）</label><input name="bottomDepth" type="number" step="0.01" min="0" required></div>
          </div>
          <label>沉积描述</label>
          <textarea name="sediment" placeholder="岩性、颜色、包含物" required></textarea>
          <div class="toolbar"><button>保存层位</button><button type="button" id="layerDelete" class="secondary">删除</button></div>
        </form>

        <h2>层位判定</h2>
        <div class="muted">深度区间重叠、层号重复或上下关系缺失的层位不进入剖面。</div>
        <div id="layerList" class="list"></div>

        <h2>地层剖面</h2>
        <div id="publishBox"></div>
        <div id="profileList" class="list"></div>
      </section>
    </aside>
  </main>
  <script src="stratigraphy.js"></script>
  <script src="archive.js"></script>
  <script src="app.js"></script>
</body>
</html>
